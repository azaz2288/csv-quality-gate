name: tests
on: [push, pull_request]
jobs:
  unittest:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python -m compileall -q csvgate tests benchmarks
      - run: python -m csvgate --help
      - run: python benchmarks/compare.py --columns 16 --rounds 3
